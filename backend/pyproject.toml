[project]
name = "lohra"
version = "0.0.11"
description = "Lohra — self-improving AI agent runtime: CLI, orchestration envelope (--json), OpenAI-compatible server"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
keywords = ["ai", "agent", "workflows", "orchestration", "self-improving", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.40.0"]
mcp = ["mcp>=1.0.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.15,<0.16",  # pinado: CI e dev na mesma família de regras
]

[project.urls]
Changelog = "https://github.com/marcelusfernandes/lohra/blob/main/backend/CHANGELOG.md"
Homepage = "https://github.com/marcelusfernandes/lohra"

[project.scripts]
lohra = "lohra.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lohra*"]

# Non-Python files that must ship inside the wheel: the BUILTIN skills (Lohra's
# own SKILL.md library). PyInstaller does NOT pick these up from the package —
# `collect_submodules` only finds modules — so packaging/lohra.spec collects them
# explicitly too. Keep both in sync; see docs/history/PACKAGING.md.
[tool.setuptools.package-data]
lohra = ["skills/builtin/**/*.md", "skills/export/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=lohra --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"
